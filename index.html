<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Piss Zone</title>
    <link rel="icon" type="image/x-icon" href="media/Favicon.png">
    <style>
        /* Base reset and layout */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background-color: #FCFAEB;
            color: black;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            text-align: center;
            margin: 10px 0;
        }

        /* Slider container fills remaining viewport on mobile */
        .slider-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
            overflow: hidden;
        }

        /* Fullscreen image */
        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Caption overlay on mobile */
        .slide figcaption {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.8);
            color: black;
            padding: 5px 10px;
            border-radius: 5px;
            text-align: center;
            max-width: 90%;
        }

        /* Navigation arrows on mobile */
        .arrows {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .arrow {
            cursor: pointer;
            font-size: 2.5rem;
            user-select: none;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 50%;
        }

        /* Desktop adjustments */
        @media (min-width: 768px) {
            /* Let image take full height automatically */
            .slider-wrapper {
                flex: none;
                height: auto;
            }
            .slide img {
                height: auto;
                max-height: 80vh;
            }
            /* Caption below image */
            .slide figcaption {
                position: static;
                transform: none;
                background: none;
                padding: 10px 0;
                margin-top: 5px;
                color: black;
            }
            /* Arrows below slider as static elements */
            .arrows {
                position: static;
                width: auto;
                justify-content: center;
                margin: 10px 0;
                padding: 0;
            }
            .arrow {
                margin: 0 15px;
                background: none;
                font-size: 2rem;
                padding: 5px;
            }
        }
    </style>
</head>
<body>


<figure class="slide">
    <img id="sliderImage" src="media/IMG_3823.PNG" alt="">
    <figcaption id="sliderCaption">Location: Greenpoint <br> Time: 6:40pm</figcaption>
</figure>

<div class="arrows">
    <div class="arrow" onclick="prevSlide()">&#8592;</div>
    <div class="arrow" onclick="nextSlide()">&#8594;</div>
</div>

<script>
    const images = [
    {src: 'media/IMG_3786.JPG', caption: '2:08am | Wed June 25'},
    {src: 'media/IMG_3785.JPG', caption: '5:37pm | Wed June 25'},
    {src: 'media/IMG_3822.JPG', caption: '6:39pm | Thu June 26'},
    {
  src: 'media/JPEG image-4160-B056-B7-0.jpeg', 
  caption: 'Caption: Should prob hydrate more but like who cares yolo fml 🤯🤯🤯🤯 <br> 12:25am | Fri June 27'
    },
    {textOnly: true, caption: 'Caption: I ran out of piss photos <br> 7:52pm | Fri June 27'},  // Text-only slide

    {src: 'media/JPEG image-448A-805C-7F-0.jpeg', caption: '9:37pm | Fri June 27'},
    {src: 'media/JPEG image-4748-A05D-E6-0.jpeg', caption: '11:43pm | Fri June 27'},
    {src: 'media/JPEG image-CBF3A15BB161-1.jpeg', caption: '7:48pm | Sat June 28'},
    {src: 'media/JPEG image-4368-92CD-50-0.jpeg', caption: 'Caption: Pretty hydrated tonight <br> 12:27pm | Sun June 29'},
    {src: 'media/JPEG image-45D0-B4AA-01-0.jpeg', caption: '7:27pm | Wed July 2'},
    {src: 'media/JPEG image-4306-9C9D-27-0.jpeg', caption: '8:48pm | Thu July 3'},
    {src: 'media/JPEG image-442E-9486-95-0.jpeg', caption: '9:03pm | Thu July 3'},
    {src: 'media/JPEG image-4C59-AC82-DF-0.jpeg', caption: '12:36am | Fri July 4'},
    {src: 'media/IMG_3823.PNG', caption: 'text a photo of your piss to 424-262-2009'},
    ];

    let currentSlide = 0;

    function updateSlide() {
        const imgEl = document.getElementById('sliderImage');
        const captionEl = document.getElementById('sliderCaption');
        const slide = images[currentSlide];

        if (slide.textOnly) {
            imgEl.style.display = 'none';         // hide image
            captionEl.innerHTML = slide.caption;   // show text
        } else {
            imgEl.style.display = 'block';
            imgEl.src = slide.src;                 // update image
            captionEl.innerHTML = slide.caption;   // update caption
        }
    }

    function prevSlide() {
        currentSlide = (currentSlide === 0)
            ? images.length - 1
            : currentSlide - 1;
        updateSlide();
    }

    function nextSlide() {
        currentSlide = (currentSlide === images.length - 1)
            ? 0
            : currentSlide + 1;
        updateSlide();
    }

    // Initialize the slider on page load
    updateSlide();
</script>

</body>
</html>
