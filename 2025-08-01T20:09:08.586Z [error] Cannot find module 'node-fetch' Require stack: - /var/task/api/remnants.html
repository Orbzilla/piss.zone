<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Human Remnants</title>
  <link rel="icon" type="image/x-icon" href="media/Favicon.png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #000;
      font-family: Arial, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slider-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 60px; /* space between arrows and image */
    }

    .arrow {
      font-size: 2.5rem;
      color: white;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    #sliderImage {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

<div class="slider-wrapper">
  <div class="arrow" onclick="prevSlide()">&#8592;</div>
  <img id="sliderImage" src="remnants/IMG_2121.JPG" alt="Slide Image" />
  <div class="arrow" onclick="nextSlide()">&#8594;</div>
</div>

<script>
  const images = [
    { src: 'media/IMG_2340.JPG' },
    { src: 'media/IMG_3823.PNG' },
    { src: 'media/IMG_4815.jpg' },
    { src: 'media/IMG_2121.jpg' },
    { src: 'media/IMG_2340.jpg' },
    { src: 'media/IMG_2389.jpg' },
    { src: 'media/IMG_2524.jpg' },
    { src: 'media/IMG_2688.jpg' },
    { src: 'media/IMG_2693.jpg' },
    { src: 'media/IMG_2998.jpg' },
    { src: 'media/IMG_3103.jpg' },
    { src: 'media/IMG_3106.jpg' },
    { src: 'media/IMG_3116.jpg' },
    { src: 'media/IMG_3121.jpg' },
    { src: 'media/IMG_3245.jpg' },
    { src: 'media/IMG_3598.jpg' },
    { src: 'media/IMG_4102.jpg' },
    { src: 'media/IMG_4432.jpg' },
    { src: 'media/IMG_4631.jpg' },
    { src: 'media/IMG_4663.jpg' },
    { src: 'media/IMG_4814.jpg' },
    { src: 'media/IMG_4834.jpg' },
    { src: 'media/IMG_4931.jpg' },
    { src: 'media/IMG_5120.jpg' },
    { src: 'media/IMG_5238.jpg' },
    { src: 'media/IMG_5244.jpg' },
    { src: 'media/IMG_5390.jpg' },
    { src: 'media/IMG_5419.jpg' },
    { src: 'media/IMG_5519.jpg' },
    { src: 'media/IMG_5598.jpg' },
    { src: 'media/IMG_5669.jpg' },
  ];

  let currentSlide = 0;

  function updateSlide() {
    const imgEl = document.getElementById('sliderImage');
    imgEl.src = images[currentSlide].src;
  }

  function prevSlide() {
    currentSlide = (currentSlide === 0) ? images.length - 1 : currentSlide - 1;
    updateSlide();
  }

  function nextSlide() {
    currentSlide = (currentSlide === images.length - 1) ? 0 : currentSlide + 1;
    updateSlide();
  }

  updateSlide();
</script>

</body>
</html>
